version: 2.1

# Kernel-only build, mirroring the "kernel" job of .github/workflows/lemonadep.yml.
# Runs on CircleCI's macOS executor instead of GitHub-hosted macos-14/15 runners,
# which have been failing to acquire capacity (macos-14 retirement brownout,
# macos-15 arm64 also capacity-constrained as of 2026-10-28). CircleCI is a
# separate infrastructure pool, so it is not affected by GitHub's shortage.
# Requires patch 0082 (xnu/patches/0082-sweet-xcode16-iorpc-kernelcontent.patch):
# CircleCI's current macOS resource class (m4pro) only offers Xcode 16+.
#
# Setup (one-time, by the user): connect this GitHub repo at circleci.com
# (sign in with GitHub, enable the project). No other config needed; CircleCI
# picks this file up automatically on push.

jobs:
  build-kernel:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    environment:
      DXB_REPO: https://github.com/blacktop/darwin-xnu-build
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      MACOS_VERSION: "13.5"
      KERNEL_CONFIG: DEVELOPMENT
      MACHINE_CONFIG: SWEET
    steps:
      - checkout
      - run:
          name: Fetch build script + stage patches
          command: |
            set -e
            git init -q dxb
            git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
            git -C dxb checkout -q FETCH_HEAD
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
            shopt -s nullglob
            overlay=(lemonadep/xnu/patches/*.patch)
            echo "lemonadep overlay patches: ${#overlay[@]}"
            for p in "${overlay[@]}"; do cp "$p" dxb/patches/; done
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
            grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
            ls dxb/patches
      - run:
          name: Deps
          command: |
            brew install jq gum bash cmake ninja
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
            sudo chmod +x /usr/local/bin/xcodes
            xcodebuild -version
            xcrun --find iig
      - run:
          name: Build
          command: |
            cd dxb
            MAKEFLAGS=-k bash build.sh
      - run:
          name: Collect
          when: always
          command: |
            mkdir -p out
            cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
            ls -la out
            (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
      - store_artifacts:
          path: out
          destination: xnu-kernel-lemonadep

workflows:
  version: 2
  kernel:
    jobs:
      - build-kernel
